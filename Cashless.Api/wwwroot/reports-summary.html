<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reportes - Resumen</title>

  <script defer src="/common.js"></script>
  <script defer src="reports-summary.js"></script>

  <style>
    :root{
      --bg:#0b0b0f; --card:#151520; --muted:#9aa0a6; --txt:#fff;
      --blue:#2f7cff; --alt:#2a2a3a; --red:#ff5a5a; --green:#35ff7a;
      --border:#232336; --field:#0f0f16;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .brand{display:flex;flex-direction:column;gap:4px}
    .title{font-size:28px;font-weight:1000}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    @media (max-width:900px){ .grid4{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:520px){ .grid4{grid-template-columns:1fr} }
    .btn{
      border:0;cursor:pointer;font-weight:900;padding:10px 14px;border-radius:12px;
      background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px
    }
    .btn.alt{background:var(--alt)}
    .btn.small{padding:8px 12px;border-radius:10px;font-size:13px}
    .kpi{display:flex;flex-direction:column;gap:6px}
    .kpi .v{font-size:24px;font-weight:1000}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#cfd3da;text-align:left}
  </style>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/site.css">
</head>

<body>
  <div class="wrap">
    <div id="appMenu" class="row no-print" style="margin-bottom:12px"></div>
    <div class="top">
      <div class="brand">
        <div class="title">Resumen</div>
        <div class="muted" id="rangePill">-</div>
        <div class="muted" id="festivalInfo">Festival: -</div>
      </div>
      <div class="row">
        <a class="btn alt" href="/reports.html">Filtros</a>
        <button id="btnReload" class="btn">Actualizar</button>
      </div>
    </div>

    <div id="msgBox" class="muted" style="margin-top:8px"></div>

    <div class="grid4">
      <div class="card kpi">
        <div class="muted" id="kpiLabel1">Total vendido</div>
        <div class="v" id="kpiTotalSold">-</div>
      </div>
      <div class="card kpi">
        <div class="muted" id="kpiLabel2">Total propina</div>
        <div class="v" id="kpiTips">-</div>
      </div>
      <div class="card kpi">
        <div class="muted" id="kpiLabel3">Usuarios</div>
        <div class="v" id="kpiUsers">-</div>
      </div>
      <div class="card kpi">
        <div class="muted" id="kpiLabel4">Transacciones</div>
        <div class="v" id="kpiTx">-</div>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div style="font-weight:1000" id="sectionTitle">Ventas por area</div>
          <div class="muted" id="sectionDesc">Resumen por area (solo cargos).</div>
        </div>
        <div class="row">
          <button id="btnExport" class="btn small alt">Export CSV</button>
          <button class="btn small alt" onclick="preparePrint(); window.print()">Imprimir PDF</button>
        </div>
      </div>

      <div class="print-header">
        <h2>Cashless - Reporte</h2>
        <p>
          Festival: <span id="printFestival"></span><br>
          Rango: <span id="printRange"></span><br>
          Generado: <span id="printGenerated"></span>
        </p>
      </div>

      <div style="overflow:auto;margin-top:10px">
        <table>
          <thead>
            <tr>
              <th id="th1">Barra</th>
              <th id="th2" style="width:160px">Ventas</th>
              <th id="th3" style="width:160px">Propina</th>
              <th id="th4" style="width:120px">Tx</th>
              <th id="th5" style="width:170px">Ticket Promedio</th>
            </tr>
          </thead>
          <tbody id="salesByAreaBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
