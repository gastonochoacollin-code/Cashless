<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Permisos · Cashless</title>
  <style>
    :root{
      --bg:#0b0b0f; --card:#151520; --muted:#9aa0a6; --txt:#fff;
      --blue:#2f7cff; --alt:#2a2a3a; --red:#ff5a5a; --green:#35ff7a;
      --field:#0f0f16;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial}
    body{margin:0;background:radial-gradient(1200px 800px at 10% 10%, #17203a 0%, transparent 60%),
                  radial-gradient(900px 700px at 90% 30%, #153a2a 0%, transparent 55%),
                  var(--bg);
         color:var(--txt);}
    .wrap{max-width:1100px;margin:36px auto;padding:0 16px;}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand .k{font-size:13px;color:var(--muted)}
    h1{margin:0;font-size:28px}
    .btn{border:0;border-radius:10px;padding:10px 12px;background:#202033;color:#fff;cursor:pointer}
    .btn:hover{filter:brightness(1.1)}
    .btn.blue{background:var(--blue)}
    .row{display:flex;gap:10px;align-items:center}
    .card{background:linear-gradient(180deg,#141423,#0f0f16);border:1px solid #22223a;border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .status{padding:12px 14px;border-radius:12px;border:1px solid #2a2a3a;background:#111122;color:#dfe6ff;margin-bottom:14px}
    .status.ok{border-color:rgba(53,255,122,.35);background:rgba(53,255,122,.06)}
    .status.warn{border-color:rgba(255,197,92,.35);background:rgba(255,197,92,.06);color:#ffe8b8}
    .status.err{border-color:rgba(255,90,90,.35);background:rgba(255,90,90,.07);color:#ffd1d1}
    table{width:100%;border-collapse:separate;border-spacing:0}
    thead th{position:sticky;top:0;background:#121226;border-bottom:1px solid #2a2a3a;padding:10px 10px;font-size:11px;color:#b7c0ff;text-transform:uppercase;letter-spacing:.08em}
    tbody td{border-bottom:1px solid #1f1f33;padding:12px 10px;vertical-align:top}
    tbody tr:hover{background:rgba(47,124,255,.05)}
    .perm-title{font-weight:700}
    .perm-desc{font-size:12px;color:var(--muted);margin-top:2px}
    .pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:10px;
      border:1px solid #2a2a3a;background:#101023}
    .pill.ok{border-color:rgba(53,255,122,.35);background:rgba(53,255,122,.06);color:var(--green)}
    .pill.no{border-color:rgba(255,90,90,.35);background:rgba(255,90,90,.06);color:var(--red)}
    .foot{margin-top:10px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="k">Cashless</div>
        <h1>Permisos por rol</h1>
        <div class="k">Vista de “quién puede hacer qué”. (Por ahora es informativo; después lo volvemos editable.)</div>
      </div>
      <div class="row">
        <button class="btn" id="btnReload">Recargar</button>
        <button class="btn blue" id="btnDash">Dashboard</button>
      </div>
    </div>

    <div class="card">
      <div id="status" class="status">Listo.</div>
      <div style="overflow:auto">
        <table id="tbl">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="foot">Tip: si ves “modo local”, es porque el backend no respondió /api/permissions o estás sin permisos. La pantalla sigue funcionando.</div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="permisos.js"></script>
</body>
</html>
