<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reportes · Cashless</title>

  <script defer src="reports.js"></script>

  <style>
    :root{
      --bg:#0b0b0f; --card:#151520; --muted:#9aa0a6; --txt:#fff;
      --blue:#2f7cff; --alt:#2a2a3a; --red:#ff5a5a; --green:#35ff7a;
      --border:#232336; --field:#0f0f16;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .brand{display:flex;flex-direction:column;gap:4px}
    .title{font-size:28px;font-weight:1000}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
    .grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    @media (max-width:900px){ .grid2{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:520px){ .grid2{grid-template-columns:1fr} }
    .btn{
      border:0;cursor:pointer;font-weight:900;padding:10px 14px;border-radius:12px;
      background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px
    }
    .btn.alt{background:var(--alt)}
    .btn.danger{background:var(--red)}
    .btn.small{padding:8px 12px;border-radius:10px;font-size:13px}
    .field{background:var(--field);border:1px solid var(--border);color:#fff;border-radius:12px;padding:10px 12px;outline:none}
    .kpi{display:flex;flex-direction:column;gap:6px}
    .kpi .v{font-size:24px;font-weight:1000}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .pill.ok{background:rgba(53,255,122,12);border:1px solid rgba(53,255,122,25);color:#b8ffd2}
    .pill.bad{background:rgba(255,90,90,12);border:1px solid rgba(255,90,90,25);color:#ffd1d1}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#cfd3da;text-align:left}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="title">Reportes</div>
        <div class="muted" id="rangePill">—</div>
              <div class="muted" id="festivalActive">Festival: —</div>
</div>
      <div class="row">
        <a class="btn alt" href="dashboard.html">Dashboard</a>
        <button id="btnReload" class="btn">Actualizar</button>
        <button id="btnBack" class="btn alt">Volver</button>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="row">
        <label class="muted">Desde</label>
        <input id="fromDate" class="field" type="date" />
        <label class="muted">Hasta</label>
        <input id="toDate" class="field" type="date" />
        <button id="btnApply" class="btn small">Aplicar</button>
        <span id="errBox" class="pill bad" style="display:none"></span>
      </div>
    </div>

    <div class="grid2">
      <div class="card kpi">
        <div class="muted">Total vendido</div>
        <div class="v" id="kpiTotalSold">—</div>
      </div>
      <div class="card kpi">
        <div class="muted">Total propina</div>
        <div class="v" id="kpiTips">—</div>
      </div>
      <div class="card kpi">
        <div class="muted">Usuarios</div>
        <div class="v" id="kpiUsers">—</div>
      </div>
      <div class="card kpi">
        <div class="muted">Transacciones</div>
        <div class="v" id="kpiTx">—</div>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div style="font-weight:1000">Ventas por barra</div>
      <div class="muted">Resumen por área (solo cargos).</div>

      <div style="overflow:auto;margin-top:10px">
        <table>
          <thead>
            <tr>
              <th>Barra</th>
              <th style="width:160px">Ventas</th>
              <th style="width:160px">Propina</th>
              <th style="width:120px">Tx</th>
              <th style="width:170px">Ticket Promedio</th>
            </tr>
          </thead>
          <tbody id="salesByAreaBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div style="font-weight:1000">Top productos</div>
      <div class="muted">Ordenado por cantidad y monto.</div>

      <div style="overflow:auto;margin-top:10px">
        <table>
          <thead>
            <tr>
              <th style="width:60px">#</th>
              <th>Producto</th>
              <th style="width:140px">Cantidad</th>
              <th style="width:160px">Monto</th>
            </tr>
          </thead>
          <tbody id="topProductsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
